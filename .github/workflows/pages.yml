name: Soundtrack replacement branch verification

on:
  push:
    branches: ["feature/replace-soundtrack-has-to-be"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run full tests
        run: node --test tests/*.test.mjs

      - name: Validate repository
        run: node scripts/validate.mjs

      - name: Build public artifact
        run: node scripts/build-site.mjs

      - name: Verify exact artifact inventory and soundtrack bytes
        shell: bash
        run: |
          expected=$(cat <<'EOF'
          .nojekyll
          assets/favicon.svg
          assets/has-to-be.opus
          assets/social-preview.png
          index.html
          script.js
          src/audio.mjs
          src/content.mjs
          src/time.mjs
          styles.css
          EOF
          )
          actual=$(find _site -type f -printf '%P\n' | sort)
          test "$actual" = "$expected"
          cmp assets/has-to-be.opus _site/assets/has-to-be.opus
          test "$(sha256sum assets/has-to-be.opus | awk '{print $1}')" = "d5fc2e189524fb8228651bc733555a327e9fe2f516fed6c7872f1bfe345a1d5e"
          ! grep -RInE 'Lunar Drive|Mondo Loops|lunar-drive\.opus' README.md index.html script.js scripts src tests
